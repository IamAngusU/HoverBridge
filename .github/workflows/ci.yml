name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Browsers / ${{ matrix.os }} / Node 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify mirrored source commit
        run: node scripts/check-mirror.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install browser engines and Linux dependencies
        if: runner.os == 'Linux'
        run: node node_modules/playwright-core/cli.js install --with-deps chromium firefox webkit
      - name: Install browser engines
        if: runner.os != 'Linux'
        run: npm run browsers:install
      - run: npm run check
      - run: npm run demo:export
      - run: npm run demo:smoke
      - run: npm run demo:smoke -- --exported
      - run: npm run package:smoke
      - name: Measure package size and core throughput
        if: runner.os == 'Linux'
        run: npm run metrics
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: hoverbridge-metrics-${{ github.sha }}
          path: |
            docs/evidence/sizes.json
            docs/evidence/benchmark.json
          if-no-files-found: error
          retention-days: 14

  node20:
    name: Package / Ubuntu / Node 20
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify mirrored source commit
        run: node scripts/check-mirror.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run package:smoke
